name: Build installers

# Push a tag like v1.0.0 to build the Windows installer and the Ubuntu .deb and
# publish both in one GitHub Release. "Run workflow" on the Actions tab builds
# test packages (downloadable from the run's artifacts) without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pick version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "0.0.0-dev.${{ github.run_number }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MetLePET-Setup-${{ steps.ver.outputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error

  build-linux:
    # Oldest supported Ubuntu runner: a bundle built against its glibc (2.35)
    # also runs on newer Ubuntu releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Pick version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install the desktop libraries Qt links to
        # Not bundled (petct_app.spec); they must be installed here for the
        # self-check and so build_linux.sh can find their packages for Depends.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(grep -v '^#' packaging/linux_build_libs.txt)

      - name: Build .deb
        run: bash packaging/build_linux.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MetLePET-deb-${{ steps.ver.outputs.version }}
          path: dist/installer/*.deb
          if-no-files-found: error

  test-deb:
    # Install the .deb on a clean newer Ubuntu: checks that Depends (worked out
    # on 22.04) resolves there and that the app starts on that system's libraries.
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MetLePET-deb-*
          path: dist
          merge-multiple: true

      - name: Install the .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb

      - name: Self-check of the installed app
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_CONFIG_HOME="$RUNNER_TEMP/config" QT_QPA_PLATFORM=offscreen
          status=0
          metlepet --selfcheck || status=$?
          cat "$XDG_DATA_HOME/MetLePET/logs/app.log" || true
          exit $status

  release:
    if: github.ref_type == 'tag'
    needs: [build-windows, build-linux, test-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
